name: Sandbox Agent

on:
  workflow_dispatch:

jobs:
  sandbox-agent:
    name: Sandbox Agent Execution
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Java 25 with GraalVM
        uses: actions/setup-java@v5
        with:
          distribution: 'graalvm'
          java-version: '25'

      - name: Setup jbang
        run: |
          curl -Ls https://sh.jbang.dev | bash -s - app setup
          echo "$HOME/.jbang/bin" >> $GITHUB_PATH

      - name: Execute PML Worflow with Churrera
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          jbang trust add https://github.com/jabrena/
          jbang churrera@jabrena run --retrieve-models
          chmod +x .github/scripts/extract-result-json.sh
          # Run churrera and capture output
          OUTPUT_FILE=$(mktemp)
          jbang churrera@jabrena run --workflow churrera-recipes/show-hardware-details/workflow.xml \
            --show-logs --delete-on-success-completion > "$OUTPUT_FILE" 2>&1
          # Display the output (logs will appear in GitHub Actions)
          cat "$OUTPUT_FILE"
          # Extract JSON from the output
          cat "$OUTPUT_FILE" | ./.github/scripts/extract-result-json.sh > docs/hardware.json
          echo ""
          echo "=== Extracted JSON ==="
          cat docs/hardware.json
          rm "$OUTPUT_FILE"

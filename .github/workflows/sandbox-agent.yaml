name: Sandbox Agent

on:
  workflow_dispatch:

jobs:
  sandbox-agent:
    name: Sandbox Agent Execution
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Java 25 with GraalVM
        uses: actions/setup-java@v5
        with:
          distribution: 'graalvm'
          java-version: '25'

      - name: Setup jbang
        run: |
          curl -Ls https://sh.jbang.dev | bash -s - app setup
          echo "$HOME/.jbang/bin" >> $GITHUB_PATH

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Retrieve Churrera Models
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          jbang trust add https://github.com/jabrena/
          jbang churrera@jabrena run --retrieve-models

      - name: Execute PML Workflow
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_ACTIONS: true
        run: |
          chmod +x .github/scripts/execute-hardware-details.sh
          ./.github/scripts/execute-hardware-details.sh churrera-recipes/7-save-cloud-agent-details/workflow.xml
